<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Project Video Gallery</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 20px;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
            }

            header {
                text-align: center;
                color: white;
                margin-bottom: 50px;
                padding: 40px 20px;
            }

            h1 {
                font-size: 3em;
                font-weight: 700;
                margin-bottom: 10px;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            }

            .subtitle {
                font-size: 1.2em;
                opacity: 0.9;
            }

            .video-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
                gap: 30px;
                padding: 20px 0;
            }

            .video-card {
                background: white;
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .video-card:hover {
                transform: translateY(-10px);
                box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            }

            .video-card h3 {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 20px;
                font-size: 1.3em;
                font-weight: 600;
                text-align: center;
            }

            .video-wrapper {
                position: relative;
                padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
                height: 0;
                overflow: hidden;
            }

            .video-wrapper video {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 2em;
                }

                .video-grid {
                    grid-template-columns: 1fr;
                    gap: 20px;
                }

                .video-card h3 {
                    font-size: 1.1em;
                    padding: 15px;
                }
            }

            @media (max-width: 480px) {
                h1 {
                    font-size: 1.5em;
                }

                header {
                    margin-bottom: 30px;
                    padding: 20px 10px;
                }
            }
        </style>
    </head>
    
    <body>
        <div class="container">
            <header>
                <h1>🤖 Robot & AI Project Gallery</h1>
                <p class="subtitle">Showcasing Innovation in Robotics</p>
            </header>

            <div class="video-grid">
                <div class="video-card">
                    <h3>Teleoperation</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/tele.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Imitation Learning</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/aloha.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Robot Manipulation</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/abb_manipulation.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Dexterous Manipulation</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v5.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Waste Sorting System</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/waste_grasp.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Patchwork Algorithm</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v1.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Robot Competition</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/exam.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Autonomous Obstacle Avoidance</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v2.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Grasping Demo</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v3.mp4" type="video/mp4">

                    </div>
                </div>

                <div class="video-card">
                    <h3>AnyGrasp</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v4.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="video-card">
                    <h3>PointNetGPD</h3>
                    <div class="video-wrapper">
                        <video controls>
                            <source src="./videos/v6 .mp4" type="video/mp4">
                        </video>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
